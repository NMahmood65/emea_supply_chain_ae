name: dbt Analytics Engineering CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb pandas pyarrow duckdb

      - name: Generate Bronze raw operational data
        run: |
          python generate_industrial_bronze.py

      - name: Check dbt source freshness
        run: |
          dbt source freshness

      - name: Run end-to-end dbt build (seeds, models, data contracts, and tests)
        run: |
          dbt build

      - name: Validate dbt Semantic Layer
        run: |
          dbt parse